name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: medishield
          POSTGRES_USER: medishield
          POSTGRES_PASSWORD: ci-placeholder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medishield -d medishield"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.13.2
        ports:
          - 6333:6333
        env:
          QDRANT__SERVICE__API_KEY: ci-placeholder
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://medishield:ci-placeholder@127.0.0.1:5432/medishield
      TEST_DATABASE_URL: postgresql+psycopg://medishield:ci-placeholder@127.0.0.1:5432/medishield_test
      POSTGRES_TEST_DB: medishield_test
      REDIS_URL: redis://:ci-placeholder@127.0.0.1:6380/0
      REDIS_PASSWORD: ci-placeholder
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_ACCESS_KEY: medishield-local
      S3_SECRET_KEY: ci-placeholder
      S3_BUCKET: medishield-documents
      S3_TEST_BUCKET: medishield-documents-test
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_API_KEY: ci-placeholder
      LLM_PROVIDER: stub
      LLM_VISION_MODEL: test-vision-placeholder
      LLM_TEXT_MODEL: test-text-placeholder
      JWT_SECRET: ci-placeholder
      SEED_TEST_USER_PASSWORD: ci-placeholder
      API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - name: Install Python dependencies
        run: uv sync --locked --dev
      - name: Ruff
        run: uv run ruff check .
      - name: Initialize test services
        run: |
          docker exec ${{ job.services.redis.id }} redis-cli CONFIG SET requirepass ci-placeholder
          docker build --build-arg MINIO_VERSION=RELEASE.2025-10-15T17-29-55Z -t ci-minio infra/minio
          docker run -d --name ci-minio -p 9000:9000 -e MINIO_ROOT_USER=medishield-local -e MINIO_ROOT_PASSWORD=ci-placeholder ci-minio
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:9000/minio/health/live && break; sleep 2; done
          curl -fsS http://127.0.0.1:9000/minio/health/live
          for attempt in {1..30}; do curl -fsS http://127.0.0.1:6333/readyz && break; sleep 2; done
          curl -fsS http://127.0.0.1:6333/readyz
          PGPASSWORD=ci-placeholder psql -h 127.0.0.1 -U medishield -d medishield -tc "SELECT 1 FROM pg_database WHERE datname='medishield_test'" | grep -q 1 || PGPASSWORD=ci-placeholder createdb -h 127.0.0.1 -U medishield medishield_test
          uv run python - <<'PY'
          import boto3
          c=boto3.client('s3',endpoint_url='http://127.0.0.1:9000',aws_access_key_id='medishield-local',aws_secret_access_key='ci-placeholder',region_name='us-east-1')
          for bucket in ('medishield-documents','medishield-documents-test'):
              try: c.create_bucket(Bucket=bucket)
              except c.exceptions.BucketAlreadyOwnedByYou: pass
          PY
      - name: Pytest
        run: uv run pytest -q

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: apps/web
      - name: Build
        run: npm run build
        working-directory: apps/web
